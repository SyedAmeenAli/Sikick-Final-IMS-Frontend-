    <style>html{background:#f4efea}html[data-theme=dark]{background:#120d10}</style>
    <script>(function(){try{var p=localStorage.getItem('sikick.theme.v1');var d=p==='dark'||((!p||p==='system')&&window.matchMedia('(prefers-color-scheme: dark)').matches);var t=d?'dark':'light';var q=new URLSearchParams(location.search).get('theme');if(q==='dark'||q==='light')t=q;document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t}catch(e){}})()</script>
